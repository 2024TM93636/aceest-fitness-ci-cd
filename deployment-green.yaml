apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-green
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest
      version: green
  template:
    metadata:
      labels:
        app: aceest
        version: green
    spec:
      containers:
        - name: aceest-container
          image: sarath93636/aceest-gym:v2.0
          ports:
            - containerPort: 5000
