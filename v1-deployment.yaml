apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest
      version: v1
  template:
    metadata:
      labels:
        app: aceest
        version: v1
    spec:
      containers:
        - name: aceest-container
          image: sarath93636/aceest-gym:v1.1
          ports:
            - containerPort: 5000
